name: CRM Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests
      - name: AEOS integration tests
        run: >-
          pytest -q
          tests/test_aeos_contracts.py
          tests/test_ebms_transport.py
          tests/test_edp_transport.py
